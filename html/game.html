            margin-top: 15px;

        #message {

            margin-top: 20px;
            background-color: #e51937; /* Red accent */
            color: white;
            display: none;

            {
                name: "Bijan Robinson",
                hints: [
                    "I was drafted 8th overall in the 2023 NFL Draft.",
                    "I am a running back known for my versatility as a runner and receiver.",
                    "I play for the Atlanta Falcons.",
                    "I recorded over 1,800 scrimmage yards in the 2024 season."
                ]

        let secretPlayer = null;
        let currentHintIndex = 0;

        const hintListUL = document.getElementById('hint-list');
        const guessInput = document.getElementById('guess-input');
        const submitButton = document.getElementById('submit-guess');
        const nextHintButton = document.getElementById('next-hint-button');
        const messageDiv = document.getElementById('message');
        const restartButton = document.getElementById('restart-button');

        function initGame() {
            // Select a random player
            const randomIndex = Math.floor(Math.random() * PLAYERS.length);
            secretPlayer = PLAYERS[randomIndex];
            currentHintIndex = 0;
            
            // Reset UI
            messageDiv.textContent = '';
            guessInput.value = '';
            guessInput.disabled = false;
            submitButton.disabled = false;
            nextHintButton.style.display = 'none';
            restartButton.style.display = 'none';
            hintListUL.innerHTML = ''; // Clear all previous hints

            // Start the game by displaying the first hint
            displayNextHint();
        }
        
        function displayNextHint() {
            const hintText = secretPlayer.hints[currentHintIndex];
            const li = document.createElement('li');
            li.textContent = hintText;
            hintListUL.appendChild(li);
        }

        function checkGuess() {
            // Normalize guess: remove extra spaces and convert to lowercase
            const guess = guessInput.value.trim().toLowerCase().replace(/\s+/g, ' '); 
            const correctName = secretPlayer.name.toLowerCase().replace(/\s+/g, ' ');

            // Strict comparison
            if (guess === correctName) {
                messageDiv.textContent = `✅ Correct! The player is ${secretPlayer.name}. You won with ${currentHintIndex + 1} hints!`;
                endGame(true);
            } else {
                messageDiv.textContent = `❌ Incorrect guess. Try again or get another hint!`;
                nextHintButton.style.display = 'inline-block';
                submitButton.disabled = true;
            }
        }
        
        function getNextHint() {
            currentHintIndex++;

            if (currentHintIndex < secretPlayer.hints.length) {
                displayNextHint(); // Display the new hint
                
                submitButton.disabled = false; // Re-enable guess button
                nextHintButton.style.display = 'none'; // Hide hint button
                guessInput.value = ''; // Clear input for new guess
                messageDiv.textContent = ''; // Clear message
            } else {
                messageDiv.textContent = `🚨 Game Over! You ran out of hints. The player was ${secretPlayer.name}.`;
                endGame(false);
            }
        }

        function endGame(isWin) {
            submitButton.disabled = true;
            guessInput.disabled = true;
            nextHintButton.style.display = 'none';
            restartButton.style.display = 'block';
        }

        // Event Listeners
        submitButton.addEventListener('click', checkGuess);
        nextHintButton.addEventListener('click', getNextHint);
        guessInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkGuess();
            }
        });

        // Initialize the game when the page loads
        document.addEventListener('DOMContentLoaded', initGame);
